[project]
name = "badminton-vision"
version = "0.1.0"
description = "Badminton match ingestion, walk-forward evaluation, and prediction experiments"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "xgboost>=2.0",
]

[project.scripts]
bviz = "badminton_vision.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
viz = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/badminton_vision"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT", "RET", "ARG", "ERA", "T20"]
ignore = ["E501"] # formatter owns line length

[tool.ruff.lint.per-file-ignores]
"**/cli.py" = ["T20"] # print is the CLI's job; banned everywhere else

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "xgboost.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "unit: fast, no real data",
    "integration: reads data/raw",
]
addopts = "-m unit"
testpaths = ["tests"]
